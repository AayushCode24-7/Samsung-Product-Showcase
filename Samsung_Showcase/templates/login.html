<!DOCTYPE html>
<html>

<head>
    <title>Log in — Samsung Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <nav class="navbar">
            <a class="logo" href="home.html">
                <img src="images/logo.png" alt="Samsung Logo">
            </a>
        </nav>
    </div>

    {% extends "base.html" %}
    {% block title %}Log in — Samsung Showcase{% endblock %}
    {% block content %}
    <section class="auth-layout">
        <div class="auth-panel">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Log in to Galaxy</h1>
            <form method="post" class="auth-form">
                {% csrf_token %}
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button class="button button-dark" type="submit">Log in</button>
            </form>
            <p class="auth-switch">New to Samsung Showcase? <a href="{% url 'signup' %}">Create an account</a></p>
            <a class="text-link" href="{% url 'home' %}">← Back to Home</a>
        </div>
    </section>
    {% endblock %}
</body>

</html>
