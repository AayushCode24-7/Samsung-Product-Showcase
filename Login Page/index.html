
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">

        <h1>One account. Any device.<br>
            Just for you.</h1>

        <p class="subtitle">Sign in to get started</p>

        <form>
            <input type="text" placeholder="Phone number or email">

            <br>

            <label>
                <input type="checkbox">
                Remember my ID
            </label>

            <br><br>

            <button type="button">Next</button>

            <p><a href="#">Find ID</a></p>

            <p><a href="#">Create account</a></p>

            <button type="button" class="social">
                Sign in with Google
            </button>

            <br><br>

            <button type="button" class="social">
                Sign in with QR code
            </button>
        </form>

    </div>

</body>
</html>
